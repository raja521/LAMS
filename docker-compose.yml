# LAMS — container setup for a self-hosted deployment.
#
#   cp .env.example .env     # then fill it in
#   docker compose up -d
#
# Every setting comes from .env. Nothing is written into this file, so the same
# compose file serves development, staging and production.
#
# NOTE: this file has not been exercised in this environment (Docker was not
# available during development). Treat the first `docker compose up` as a step to
# verify rather than assume — see OPEN-QUESTIONS.md.

services:
  mongo:
    image: mongo:7
    restart: unless-stopped
    # Only exposed to the app by default. Uncomment to reach it from the host.
    # ports:
    #   - "27017:27017"
    environment:
      MONGO_INITDB_DATABASE: ${MONGODB_DB_NAME}
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.runCommand({ping:1}).ok"]
      interval: 10s
      timeout: 5s
      retries: 5

  app:
    build:
      context: .
      args:
        # The browser bundle is compiled at build time, so its VITE_* values are
        # build arguments. None of them is a secret.
        VITE_APP_NAME: ${VITE_APP_NAME}
        VITE_API_BASE_URL: ${VITE_API_BASE_URL}
        VITE_ORG_NAME: ${VITE_ORG_NAME}
        VITE_AUTH_PROVIDER: ${VITE_AUTH_PROVIDER}
        VITE_MAP_PROVIDER: ${VITE_MAP_PROVIDER}
        VITE_MAP_BASEMAP_URL: ${VITE_MAP_BASEMAP_URL}
        VITE_MAP_BASEMAP_ATTRIBUTION: ${VITE_MAP_BASEMAP_ATTRIBUTION}
        VITE_MAP_DEFAULT_CENTER: ${VITE_MAP_DEFAULT_CENTER}
        VITE_MAP_DEFAULT_ZOOM: ${VITE_MAP_DEFAULT_ZOOM}
        VITE_MAP_MAX_ZOOM: ${VITE_MAP_MAX_ZOOM}
        VITE_MAP_LAYERS: ${VITE_MAP_LAYERS}
        VITE_MAP_API_KEY: ${VITE_MAP_API_KEY}
        VITE_MAP_FEATURE_SERVICE_URL: ${VITE_MAP_FEATURE_SERVICE_URL}
        VITE_FEATURE_MAP: ${VITE_FEATURE_MAP}
        VITE_FEATURE_DOCUMENT_GENERATION: ${VITE_FEATURE_DOCUMENT_GENERATION}
        VITE_FEATURE_TIMBER: ${VITE_FEATURE_TIMBER}
        CLIENT_URL: ${CLIENT_URL}
    restart: unless-stopped
    depends_on:
      mongo:
        condition: service_healthy
    # The whole .env is passed through, so the server reads exactly what it does
    # when run directly. Missing required values still stop the container at boot.
    env_file:
      - .env
    environment:
      # Inside the network the database is reached by service name, whatever the
      # host-side value in .env says.
      MONGODB_URI: mongodb://mongo:27017/${MONGODB_DB_NAME}
    ports:
      - "${PORT}:${PORT}"
    volumes:
      # Generated documents, scheduled reports and the AccuFund file drop all
      # need to outlive the container.
      - ./uploads:/app/uploads
      - ./reports:/app/reports
      - ./integration:/app/integration

volumes:
  mongo-data:
